<body>
<header><div class="wrap nav"><div class="brand"><span class="mark" aria-hidden="true"></span>生态箱<span class="nav-label">OBSERVATORY</span></div><div class="live" id="connection" data-state="loading"><span class="dot"></span><span id="connection-label">连接中</span></div></div></header>
<main class="wrap">
<section id="announcements" class="announcements" aria-label="服务端公告" aria-live="polite" hidden></section>
<section class="hero"><div><p class="eyebrow">CORTICO / LIVING ECOSYSTEMS</p><h1>一方天地，<br>自有<span>生机。</span></h1><p class="intro">观察植物生长、虫鱼觅食，看看每个生态箱的近况。</p></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="vessel"><div class="soil"></div><div class="stem"><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i></div></div><div class="vessel water"><div class="waterline"></div><div class="stem"><i class="leaf"></i></div><div class="fish"></div></div><span class="art-caption">LAND & WATER</span></div></section>
<section class="overview" aria-label="生态箱概览"><div class="stat"><strong id="box-count">—</strong><span id="box-count-label">地箱</span></div><div class="stat"><strong id="plant-count">—</strong><span>植物</span></div><div class="stat"><strong id="animal-count">—</strong><span id="animal-count-label">虫子</span></div></section>
<section aria-labelledby="gallery-title"><div class="section-top"><h2 class="section-title" id="gallery-title">生态箱图鉴 <small>COLLECTION</small></h2><div class="tools"><div class="tabs" role="group" aria-label="生态箱类型"><button class="tab" data-kind="land" aria-pressed="true">生态箱·地</button><button class="tab" data-kind="water" aria-pressed="false">生态箱·水</button></div><div class="search-wrap"><input class="search" id="search" type="text" role="searchbox" placeholder="搜索名称或 ID" aria-label="搜索生态箱名称或 ID"><button id="clear-search" class="clear-search" aria-label="清除搜索" hidden></button></div></div></div>
<div class="filter-row"><p id="status" role="status">正在读取生态箱…</p><div id="sort"></div></div>
<div class="error-banner" id="error" role="alert" hidden><span></span><button id="retry">重新连接</button></div>
<div class="empty" id="empty" hidden><div class="empty-icon" aria-hidden="true">♧</div><h3 id="empty-title"></h3><p id="empty-copy"></p></div>

</section>

<script type="module">
import { createScene, createWaterScene, createPublicSelect, createPublicReplayControls } from './scene.js?v=0.7.3-colony';
const $=id=>document.getElementById(id);
const sort=createPublicSelect($('sort'),'排列方式',()=>render());sort.setOptions([{value:'score',label:'按积分排序'},{value:'recent',label:'按上报时间排序'}]);
const scenes=new Map();let kind='land',entries=[],loaded=false,requestVersion=0,loading=false;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)'),animations=new Set();
function animate(node,frames,options){
 if(reducedMotion.matches)return;
 const animation=node.animate(frames,options);animations.add(animation);
 animation.onfinish=animation.oncancel=()=>animations.delete(animation);
}
reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches)for(const animation of animations)animation.cancel()});
function setCount(id,value){
 const node=$(id),text=String(value);if(node.textContent===text)return;
 node.textContent=text;animate(node,[{opacity:.35,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],{duration:350,easing:'ease-out'});
}
const dateFormat=new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
function el(tag,className,text){const node=document.createElement(tag);node.className=className;if(text!==undefined)node.textContent=text;return node}
function clearViews(){for(const view of scenes.values()){view.scene.dispose();view.replay.dispose();view.article.remove()}scenes.clear()}
function render(){
 const water=kind==='water';
 setCount('box-count',loaded?entries.length:'—');setCount('plant-count',loaded?entries.reduce((sum,e)=>sum+e.state.plants.length,0):'—');setCount('animal-count',loaded?entries.reduce((sum,e)=>sum+(water?e.state.fish:e.state.bugs).length,0):'—');
 $('box-count-label').textContent=water?'水箱':'地箱';$('animal-count-label').textContent=water?'鱼':'虫子';
 const query=$('search').value.trim().toLocaleLowerCase();$('clear-search').hidden=!$('search').value;
 const ranking=new Map([...entries].sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id)).map((entry,index)=>[entry.id,index+1]));
 const rows=entries.filter(entry=>((entry.state.name??'')+' '+entry.id).toLocaleLowerCase().includes(query)).sort(sort.value==='recent'?(a,b)=>Date.parse(b.reportedAt)-Date.parse(a.reportedAt)||a.id.localeCompare(b.id):(a,b)=>ranking.get(a.id)-ranking.get(b.id));
 $('status').textContent=loaded?(query?'找到 '+rows.length+' 个生态箱':'共 '+entries.length+' 个'+(water?'水箱':'地箱')):'正在读取生态箱…';
 const empty=loaded&&!rows.length;$('empty').hidden=!empty;
 if(empty){$('empty-title').textContent=query?'没有找到这个生态箱':water?'水域静候第一位住客':'这里还没有生态箱';$('empty-copy').textContent=query?'试试其他名称或 ID。':'认领并上报后，生态箱会出现在这里。'}
 const ids=new Set(rows.map(entry=>entry.id));
 for(const [id,view] of scenes)if(!ids.has(id)){view.scene.dispose();view.replay.dispose();view.article.remove();scenes.delete(id)}
 rows.forEach((entry,index)=>{
  let view=scenes.get(entry.id);
  const isNew=!view;
  if(!view){
   const article=el('article','box'+(water?' water-box':'')),head=el('div','box-head'),rank=el('span','rank'),heading=el('div','heading'),title=el('h3',''),id=el('div','box-id','ID / '+entry.id),score=el('div','score'),points=el('strong',''),sceneWrap=el('div','scene-wrap'),canvas=document.createElement('canvas'),phase=el('span','phase'),metrics=el('div','box-metrics'),quality=el('div','quality'),replayContainer=el('div','replay-container'),foot=el('div','box-foot'),time=el('time','');
   canvas.width=800;canvas.height=500;canvas.setAttribute('role','img');score.append(points,el('span','','生态积分'));heading.append(title,id);head.append(rank,heading,score);sceneWrap.append(canvas,phase);foot.append(el('span','',water?'WATER / 水生生态':'LAND / 陆生生态'),time);article.append(head,sceneWrap,metrics,quality,replayContainer,foot);
   view={article,rank,title,points,canvas,phase,metrics,quality,time,scene:water?createWaterScene(canvas):createScene(canvas),replay:createPublicReplayControls(replayContainer,water?createWaterScene:createScene)};scenes.set(entry.id,view);
  }
  const state=entry.state,rank=ranking.get(entry.id);view.article.dataset.rank=rank;view.rank.textContent=String(rank).padStart(2,'0');view.title.textContent=state.name??entry.id;view.points.textContent=Number(entry.score).toLocaleString('zh-CN',{maximumFractionDigits:1});view.canvas.setAttribute('aria-label',view.title.textContent+'的'+(water?'水箱':'地箱')+'场景');view.phase.textContent=entry.phase==='night'?'夜晚':'白天';
  const metrics=water?[['水生植物',state.plants.length],['鱼',state.fish.length],['饲料',state.food.reduce((sum,food)=>sum+food.portions,0)]]:[['植物',state.plants.length],['虫子',state.bugs.length],['种子 / 虫卵',state.seeds.length+' / '+(state.eggs?.length??0)]];
  view.metrics.replaceChildren(...metrics.map(([label,value])=>{const node=el('div','metric',label);node.append(el('strong','',String(value)));return node}));view.quality.hidden=!water;
  if(!water){view.quality.hidden=!(state.nests?.length);view.quality.textContent=(state.nests??[]).map(nest=>'蚁巢 '+nest.depth+' 层 · 储粮 '+nest.food+'/'+(nest.depth*20)).join(' · ')}
  if(water)view.quality.replaceChildren(...[['含氧量',state.oxygen],['水质',state.cleanliness]].map(([label,value])=>{const node=el('span','',label);node.append(el('b','',value.toFixed(1)));return node}));
  view.time.dateTime=entry.reportedAt;view.time.textContent=dateFormat.format(new Date(entry.reportedAt))+' 上报';if($('list').children[index]!==view.article)$('list').insertBefore(view.article,$('list').children[index]??null);view.scene.setState({...state,phase:entry.phase??'day'});view.replay.setReplays(state.replays??[]);
  if(isNew)animate(view.article,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'translateY(0)'}],{duration:480,delay:Math.min(index,5)*65,easing:'cubic-bezier(.2,.7,.3,1)',fill:'backwards'});
 });
}
let publicAnnouncements=[];
async function loadAnnouncements(){
 try{
  const response=await fetch('/api/announcements/public?view=latest',{signal:AbortSignal.timeout(10000),cache:'no-store'});if(!response.ok)return;
  const {announcements:next}=await response.json();if(JSON.stringify(next)===JSON.stringify(publicAnnouncements))return;
  const oldIds=new Set(publicAnnouncements.map(notice=>notice.id));publicAnnouncements=next;const root=$('announcements');root.hidden=!next.length;
  root.replaceChildren(...[...next].reverse().map(notice=>{const article=el('article','announcement'),title=el('h3','',notice.title||'服务端公告'),text=el('p','',notice.text),time=el('time','',dateFormat.format(new Date(notice.createdAt)));time.dateTime=notice.createdAt;article.append(title,text,time);if(!oldIds.has(notice.id))animate(article,[{opacity:0,transform:'translateY(-8px)'},{opacity:1,transform:'translateY(0)'}],{duration:320,easing:'ease-out'});return article}));
 }catch{}
}
async function load(){
 const version=++requestVersion,requestedKind=kind;loading=true;
 try{
  const response=await fetch('/api/leaderboard?kind='+requestedKind,{signal:AbortSignal.timeout(10000),cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);
  const rows=await response.json();if(version!==requestVersion)return;
  entries=rows;loaded=true;$('error').hidden=true;$('connection').dataset.state='online';$('connection-label').textContent='同步中 · 每 5 秒';render();
 }catch(error){if(version!==requestVersion)return;$('error').hidden=false;$('error').querySelector('span').textContent=loaded?'连接中断，保留上次同步的状态。':'暂时无法读取生态箱。';$('connection').dataset.state='error';$('connection-label').textContent='连接中断';if(!loaded)$('status').textContent='等待重新连接';}
 finally{if(version===requestVersion)loading=false}
}
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{if(kind===button.dataset.kind)return;kind=button.dataset.kind;document.querySelectorAll('.tab').forEach(tab=>tab.setAttribute('aria-pressed',String(tab===button)));entries=[];loaded=false;clearViews();$('error').hidden=true;render();void load()}));
$('search').addEventListener('input',render);$('clear-search').addEventListener('click',()=>{$('search').value='';$('search').focus();render()});$('retry').addEventListener('click',()=>void load());
void loadAnnouncements();setInterval(()=>void loadAnnouncements(),5000);
void load();setInterval(()=>{if(!loading)void load()},5000);
window.addEventListener('pagehide',()=>{sort.dispose();clearViews();for(const animation of animations)animation.cancel()});
</script>
